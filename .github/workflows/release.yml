name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build Debian and RPM packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.0'
          cache: true

      - name: Full gate before release
        run: ./scripts/check.sh

      - name: Install native packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dpkg-dev rpm cpio
          dpkg-query -W dpkg-dev rpm cpio

      - name: Build release packages
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/release.sh

      - name: Verify release packages
        run: ./scripts/test-packages.sh

      - name: Publish GitHub Release with Debian and RPM packages only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag --title "$RELEASE_TAG" --generate-notes \
            "${flags[@]}" dist/*.deb dist/*.rpm
